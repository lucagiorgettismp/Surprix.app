<?xml version="1.0" encoding="UTF-8"?>
<!--
  Template "scopri la serie" - canvas fissa 3:4 (1080x1440).
  Apribile e modificabile in Illustrator: sfondo, watermark, header e blocco
  brand sono statici. La griglia dei pezzi NON e' qui (dipende dal numero di
  pezzi della serie) - viene inserita dallo script al posto del marker GRID
  CONTENT qui sotto, prima del watermark (che resta sempre sopra a tutto,
  anche sopra la griglia, per resistere ai ritagli).

  Placeholder sostituiti dallo script/funzione (cercati per id, non spostare/rinominare):
    id="cl-title"      - nome della serie
    id="cl-subtitle"   - produttore e anno
    id="cl-brand-logo" - logo Surprix, sempre ancorato al margine destro (posizione
                         fissa, indipendente dalla lunghezza del testo a fianco); la
                         funzione/script sostituisce solo il transform per adattare
                         la dimensione/altezza al numero di righe di testo a fianco
    id="cl-brand-main" - "powered by Surprix" (generica) oppure lo username, piu' in
                         risalto (mancolista personale, che lo scambia con cl-brand-sub)
    id="cl-brand-sub"  - "surprix.app" (generica) oppure "powered by Surprix" (mancolista)
    id="cl-brand-date" - vuoto (generica) oppure data di generazione (mancolista)
-->
